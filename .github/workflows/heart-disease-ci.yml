name: Heart Disease CI

on:
  push:
    branches: [main]
    paths:
      - "heart-disease-mlops/**"
      - ".github/workflows/heart-disease-ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "heart-disease-mlops/**"
      - ".github/workflows/heart-disease-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: heart-disease-mlops

    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: heart-disease-mlops/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Lint Python code
        run: python -m ruff check scripts tests --select E4,E7,E9,F

      - name: Run automated tests
        run: |
          mkdir -p reports
          python -m pytest tests -v --junitxml=reports/test-results.xml

      - name: Download dataset
        run: python scripts/download_data.py

      - name: Prepare train and test data
        run: python scripts/prepare_data.py

      - name: Train baseline models
        run: python scripts/train_models.py

      - name: Tune and select model
        run: python scripts/tune_models.py

      - name: Evaluate selected model
        run: python scripts/evaluate_model.py

      - name: Verify saved pipeline
        run: python scripts/verify_model.py

      - name: Upload reports and model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            heart-disease-mlops/reports/
            heart-disease-mlops/models/
            heart-disease-mlops/mlflow.db
            heart-disease-mlops/mlartifacts/
          if-no-files-found: warn
          retention-days: 14